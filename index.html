<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Namari · Catálogo</title>
<meta name="description" content="Catálogo da Namari, moda feminina. Escolha a peça e fale com a gente no WhatsApp.">
<meta name="theme-color" content="#f6f1ea">
<meta property="og:title" content="Namari · Catálogo">
<meta property="og:description" content="As peças novas da Namari. Toque em “Quero essa peça” e fale com a gente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 🪟 Vitrinista da Namari: lê as peças da Sheila na hora (peça nova entra e esgotada sai sozinha). */
  :root {
    --fundo: #f6f1ea; --cartao: #fffdfa; --tinta: #2b2420; --suave: #7a6e66; --linha: #e7ddd2;
    --marca: #8a5a44; --marca-escura: #6e4533; --chip: #efe6dc; --sombra: 0 1px 2px rgba(60,40,30,.06), 0 6px 18px rgba(60,40,30,.07);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fundo); color: var(--tinta); font: 15px/1.45 Inter, system-ui, -apple-system, sans-serif; }
  header { text-align: center; padding: 34px 16px 10px; }
  .logo { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 46px; letter-spacing: .14em; margin: 0; text-transform: uppercase; }
  .sub { color: var(--suave); font-size: 13px; letter-spacing: .22em; text-transform: uppercase; margin-top: 2px; }
  .insta { display: inline-block; margin-top: 10px; color: var(--marca); font-size: 14px; text-decoration: none; }
  nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--fundo) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; max-width: 1100px; margin: 0 auto; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--linha); background: var(--cartao); color: var(--tinta); border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--tinta); color: var(--fundo); border-color: var(--tinta); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 48px; }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (min-width: 700px) { .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; } }
  @media (min-width: 1000px) { .grade { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .peca { background: var(--cartao); border-radius: 14px; overflow: hidden; box-shadow: var(--sombra); display: flex; flex-direction: column; }
  .foto { aspect-ratio: 4/5; background: var(--chip); border: 0; padding: 0; cursor: zoom-in; display: block; width: 100%; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .nome { font-weight: 500; font-size: 14.5px; margin: 0; }
  .preco { font-family: "Cormorant Garamond", Georgia, serif; font-size: 22px; font-weight: 600; color: var(--marca-escura); line-height: 1; }
  .cores { color: var(--suave); font-size: 12.5px; }
  .tams { display: flex; flex-wrap: wrap; gap: 5px; }
  .tam { min-width: 34px; border: 1px solid var(--linha); background: transparent; border-radius: 8px; padding: 5px 7px; font: inherit; font-size: 12.5px; color: var(--tinta); cursor: pointer; }
  .tam[aria-pressed="true"] { background: var(--marca); border-color: var(--marca); color: #fff; }
  .quero { margin-top: auto; display: block; text-align: center; background: var(--marca); color: #fff; text-decoration: none; border-radius: 10px; padding: 11px 8px; font-weight: 600; font-size: 14px; }
  .quero:active { background: var(--marca-escura); }
  .aviso { text-align: center; color: var(--suave); padding: 48px 16px; }
  .esqueleto .foto, .esqueleto .linha { background: linear-gradient(90deg, var(--chip), #f7f0e8, var(--chip)); background-size: 200% 100%; animation: brilho 1.3s infinite; }
  .esqueleto .linha { height: 12px; border-radius: 6px; margin: 4px 0; }
  @keyframes brilho { to { background-position: -200% 0; } }
  footer { text-align: center; color: var(--suave); font-size: 12.5px; padding: 0 16px 36px; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; }
  dialog::backdrop { background: rgba(20,14,10,.85); }
  dialog img { max-width: 100vw; max-height: 92vh; display: block; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .esqueleto .foto, .esqueleto .linha { animation: none; } }
</style>
</head>
<body>
<header>
  <h1 class="logo">Namari</h1>
  <div class="sub">moda feminina</div>
  <a class="insta" href="https://www.instagram.com/namari_feminino" target="_blank" rel="noopener">@namari_feminino</a>
</header>
<nav><div class="chips" id="chips" role="toolbar" aria-label="Categorias"></div></nav>
<main>
  <div class="grade" id="grade" aria-live="polite"></div>
</main>
<footer>Escolha o tamanho e toque em <b>Quero essa peça</b> para falar com a gente.</footer>
<dialog id="zoom" onclick="this.close()"><img alt=""></dialog>

<script>
  // ---- Configuração (o Vitrinista só lê; quem escreve no quadro é a Sheila) ----
  const SHEILA = "https://script.google.com/macros/s/AKfycby_ZSkLAnolCtiirdZykfTug9vQhdynzTBVgZnf3Bnj_dvxfwrv5xqwjGGN735HUuv6/exec?catalogo=1";
  const WHATSAPP = ""; // número da loja com DDI e DDD, só números (ex.: 5511912345678). Vazio = abre o Direct do Instagram.
  const INSTAGRAM = "namari_feminino";

  const $ = (s) => document.querySelector(s);
  let pecas = [], categoria = "Tudo";

  const real = (v) => {
    const n = typeof v === "number" ? v : parseFloat(String(v).replace(/[^\d,.-]/g, "").replace(/\.(?=\d{3})/g, "").replace(",", "."));
    return isFinite(n) && n > 0 ? n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }) : "";
  };
  const tamanhos = (t) => String(t || "").split(/[,/;]| e /).map((x) => x.trim()).filter(Boolean);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function link(p, tam) {
    const msg = "Oi! Vi no catálogo da Namari e quero essa peça:\n" + p.nome + " (" + p.codigo + ")" +
      (real(p.preco) ? " – " + real(p.preco) : "") + (tam ? "\nTamanho: " + tam : "") + "\n" + location.origin + location.pathname + "#" + p.codigo;
    return WHATSAPP ? "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg) : "https://ig.me/m/" + INSTAGRAM;
  }

  function desenharChips() {
    const cats = ["Tudo", ...new Set(pecas.map((p) => p.categoria))];
    if (!cats.includes(categoria)) categoria = "Tudo";
    $("#chips").innerHTML = cats.map((c) => `<button class="chip" aria-pressed="${c === categoria}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
    $("#chips").style.display = cats.length > 2 ? "" : "none";
  }

  function desenhar() {
    const lista = pecas.filter((p) => categoria === "Tudo" || p.categoria === categoria);
    if (!lista.length) { $("#grade").innerHTML = '<p class="aviso" style="grid-column:1/-1">Peças novas chegando em breve ✨</p>'; return; }
    $("#grade").innerHTML = lista.map((p) => {
      const tams = tamanhos(p.tamanhos);
      return `<article class="peca" id="${esc(p.codigo)}">
        <button class="foto" data-zoom="${esc(p.foto)}" aria-label="Ver foto maior de ${esc(p.nome)}"><img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy"></button>
        <div class="info">
          <h2 class="nome">${esc(p.nome)}</h2>
          ${real(p.preco) ? `<div class="preco">${real(p.preco)}</div>` : ""}
          ${p.cores ? `<div class="cores">${esc(p.cores)}</div>` : ""}
          ${tams.length ? `<div class="tams" role="group" aria-label="Tamanho">${tams.map((t) => `<button class="tam" aria-pressed="${tams.length === 1}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
          <a class="quero" href="${esc(link(p, tams.length === 1 ? tams[0] : ""))}" target="_blank" rel="noopener">Quero essa peça</a>
        </div></article>`;
    }).join("");
  }

  document.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (chip) { categoria = chip.dataset.c; desenharChips(); desenhar(); scrollTo({ top: 0, behavior: "smooth" }); return; }
    const tam = e.target.closest(".tam");
    if (tam) {
      const card = tam.closest(".peca"), p = pecas.find((x) => x.codigo === card.id);
      card.querySelectorAll(".tam").forEach((b) => b.setAttribute("aria-pressed", b === tam));
      card.querySelector(".quero").href = link(p, tam.dataset.t);
      return;
    }
    const f = e.target.closest("[data-zoom]");
    if (f) { const d = $("#zoom"); d.querySelector("img").src = f.dataset.zoom.replace("=w900", "=w1600"); d.showModal(); }
  });

  async function carregar() {
    $("#grade").innerHTML = Array.from({ length: 4 }, () => '<div class="peca esqueleto"><div class="foto"></div><div class="info"><div class="linha"></div><div class="linha" style="width:50%"></div></div></div>').join("");
    try {
      const r = await fetch(SHEILA, { cache: "no-store" });
      const d = await r.json();
      pecas = d.pecas || [];
      desenharChips(); desenhar();
      if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView({ block: "center" });
    } catch (err) {
      $("#grade").innerHTML = '<p class="aviso" style="grid-column:1/-1">Não consegui carregar as peças agora. <a href="" style="color:var(--marca)">Tentar de novo</a></p>';
    }
  }
  carregar();
</script>
</body>
</html>
