      <div class="total"><span>TOTAL</span><span class="pontos"></span><b id="total"></b></div>
      <input id="nome" placeholder="Seu nome" autocomplete="given-name" aria-label="Seu nome">
      <a class="zap" id="finalizar" href="https://api.whatsapp.com/send?phone=5519971060389"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>Finalizar pelo WhatsApp</a>
      <p class="obs">Sem pagamento aqui: a gente combina tudo pelo WhatsApp.</p>
    </div>
  </div>
</dialog>

<script>
  // ---------------- Configuração ----------------
  const SHEILA = "https://script.google.com/macros/s/AKfycby_ZSkLAnolCtiirdZykfTug9vQhdynzTBVgZnf3Bnj_dvxfwrv5xqwjGGN735HUuv6/exec?catalogo=1";
  const WHATSAPP = "5519971060389";
  const PRECOS_FIXOS = [30, 40, 60, 90];
  // Abas e as categorias do Carlão que entram em cada uma. As de Roupas aparecem mesmo vazias.
  const SECOES = [
    { nome: "Roupas", fixas: ["Blusas", "Vestidos", "Calças", "Saias", "Shorts", "Conjuntos"], precos: true,
      junta: ["Camisetas", "Camisas", "Macacões", "Casacos", "Moda praia", "Lingerie"] },
    { nome: "Acessórios", fixas: [], junta: ["Acessórios", "Bolsas", "Mochilas"] },
    { nome: "Higiene e cuidados", fixas: [], junta: ["Higiene e cuidados"] },
    { nome: "Sapatos", fixas: [], junta: ["Calçados", "Sapatos"] },
  ];
  const CORES = { preto: "#111", preta: "#111", branco: "#fff", branca: "#fff", "off-white": "#f3efe6", offwhite: "#f3efe6",
    bege: "#d9c5a6", nude: "#e3bfa3", cinza: "#9a9a9a", "azul marinho": "#1f2a4d", marinho: "#1f2a4d", "azul jeans": "#4d6f99",
    jeans: "#4d6f99", "azul bebe": "#bcd7ee", "azul claro": "#a9c8e6", azul: "#2f5fa8", lavanda: "#b9a7d6", lilas: "#b79cd1",
    roxo: "#6a3d8f", rosa: "#ee9fb8", "rosa claro": "#f6c6d4", pink: "#e3457f", vermelho: "#c8102e", vermelha: "#c8102e",
    vinho: "#6d1a2b", laranja: "#ee7d32", amarelo: "#f0cf43", amarela: "#f0cf43", verde: "#4d8a5b", "verde militar": "#5b6340",
    "verde agua": "#8fd0c3", marrom: "#6e4a32", caramelo: "#b07a45", terracota: "#b8633f", dourado: "#c9a548", prata: "#c0c0c0" };
  const CORACAO = '<svg class="coracao" viewBox="0 0 24 22" aria-hidden="true"><use href="#cor"/></svg>';

  // ---------------- Estado ----------------
  const $ = (s) => document.querySelector(s);
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const ler = (k, padrao) => { try { return JSON.parse(localStorage.getItem(k)) ?? padrao; } catch (e) { return padrao; } };
  const calmo = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pecas = [], secao = "Roupas", preco = 0, categoria = "Todas";
  let sacola = ler("namari-sacola", []);
  const escolhas = {}; // codigo -> { tam, cor }

  const num = (v) => typeof v === "number" ? v : parseFloat(String(v || "").replace(/[^\d,.]/g, "").replace(/\.(?=\d{3})/g, "").replace(",", ".")) || 0;
  const real = (n) => n ? "R$ " + n.toLocaleString("pt-BR", { minimumFractionDigits: n % 1 ? 2 : 0 }) : "";
  const lista = (t) => String(t || "").split(/,|\/|;| e /).map((x) => x.trim()).filter(Boolean);
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const semAcento = (t) => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const corHex = (c) => CORES[semAcento(c)];
  const secaoDe = (p) => (SECOES.find((s) => s.fixas.includes(p.categoria) || s.junta.includes(p.categoria)) || SECOES[0]).nome;
  const plural = (n, um, varios) => n + " " + (n === 1 ? um : varios);

  // ---------------- Topo ----------------
  (function () {
    const item = `<span>PREÇO FIXO</span>${CORACAO}` + PRECOS_FIXOS.map((v) => `<span>${real(v)}</span>${CORACAO}`).join("");
    $("#faixa").innerHTML = item.repeat(6);
    const txt = "De SCP para o Brasil", el = $("#digita");
    if (calmo) { el.textContent = txt; return; }
    let i = 0; const t = setInterval(() => { el.textContent = txt.slice(0, ++i); if (i >= txt.length) clearInterval(t); }, 85);
  })();

  // ---------------- Desenho ----------------
  function desenharAbas() {
    $("#abas").innerHTML = SECOES.map((s) => `<button class="aba" aria-pressed="${s.nome === secao}" data-secao="${esc(s.nome)}">${esc(s.nome)}${CORACAO}</button>`).join("");
  }

  function desenharFiltros() {
    const s = SECOES.find((x) => x.nome === secao);
    const daqui = pecas.filter((p) => secaoDe(p) === secao);
    let html = "";
    if (s.precos) {
      const valores = [...new Set([...PRECOS_FIXOS, ...daqui.map((p) => num(p.preco)).filter(Boolean)])].sort((a, b) => a - b);
      const qtos = (v) => daqui.filter((p) => !v || num(p.preco) === v).length;
      html += `<div class="filtro"><p class="rotulo"><b>1.</b> escolha o valor</p><div class="linha tags">
        <button class="tag" aria-pressed="${!preco}" data-preco="0"><i>Todos</i><small>${plural(qtos(0), "peça", "peças")}</small></button>
        ${valores.map((v) => `<button class="tag valor${qtos(v) ? "" : " zero"}" aria-pressed="${preco === v}" data-preco="${v}"><i>${real(v)}</i><small>${plural(qtos(v), "peça", "peças")}</small></button>`).join("")}</div></div>`;
    }
    const base = s.precos && preco ? daqui.filter((p) => num(p.preco) === preco) : daqui;
    const cats = [...new Set([...s.fixas, ...base.map((p) => p.categoria)])];
    if (cats.length > 1) {
      if (!cats.includes(categoria)) categoria = "Todas";
      const qtos = (c) => base.filter((p) => c === "Todas" || p.categoria === c).length;
      html += `<div class="filtro"><p class="rotulo"><b>${s.precos ? "2." : ""}</b> ${s.precos ? "escolha a peça" : "categorias"}</p><div class="linha">
        ${["Todas", ...cats].map((c) => { const n = qtos(c);
          return `<button class="fita${n ? "" : " vazia"}" aria-pressed="${c === categoria}" data-cat="${esc(c)}">${esc(c)}<sup>${n}</sup></button>`; }).join("")}</div></div>`;
    } else categoria = "Todas";
    $("#filtros").innerHTML = html;
  }

  function cartao(p, n) {
    const tams = lista(p.tamanhos), cores = lista(p.cores);
    const e = escolhas[p.codigo] || (escolhas[p.codigo] = { tam: tams.length === 1 ? tams[0] : "", cor: cores.length === 1 ? cores[0] : "" });
    return `<article class="peca" id="${esc(p.codigo)}" style="animation-delay:${Math.min(n, 8) * 40}ms">
      <button class="foto" data-zoom="${esc(p.foto)}" aria-label="Ver foto maior de ${esc(p.nome)}"><img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy" onload="this.classList.add('ok')"></button>
      <div class="meta"><span class="preco">${real(num(p.preco)) || "?"}</span><h2 class="nome">${esc(p.nome)}</h2></div>
      ${cores.length ? `<div class="escolha" role="group" aria-label="Cor">${cores.map((c) => {
        const h = corHex(c);
        return h ? `<button class="cor" style="background:${h}" title="${esc(c)}" aria-label="${esc(c)}" aria-pressed="${e.cor === c}" data-cor="${esc(c)}"></button>`
                 : `<button class="cor txt" aria-pressed="${e.cor === c}" data-cor="${esc(c)}">${esc(c)}</button>`;
      }).join("")}</div><div class="corNome">${esc(e.cor || (cores.length > 1 ? "escolha a cor" : ""))}</div>` : ""}
      ${tams.length ? `<div class="escolha" role="group" aria-label="Tamanho">${tams.map((t) => `<button class="tam" aria-pressed="${e.tam === t}" data-tam="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
      <div class="falta" aria-live="polite"></div>
      <button class="add" data-add>${CORACAO.replace('class="coracao"', "")}Quero</button>
    </article>`;
  }

  function desenhar() {
    desenharAbas(); desenharFiltros();
    const s = SECOES.find((x) => x.nome === secao);
    const vis = pecas.filter((p) => secaoDe(p) === secao && (!s.precos || !preco || num(p.preco) === preco) && (categoria === "Todas" || p.categoria === categoria));
    $("#contagem").textContent = vis.length ? plural(vis.length, "peça", "peças") + (preco ? " de " + real(preco) : "") + (categoria !== "Todas" ? " · " + categoria.toLowerCase() : "") : "";
    $("#grade").innerHTML = vis.length ? vis.map(cartao).join("")
      : `<p class="vazio">${CORACAO}Nenhuma peça cadastrada aqui ainda —<br>em breve novidades!</p>`;
  }

  // ---------------- Sacola ----------------
  function salvarSacola() { guardar("namari-sacola", sacola); desenharBarra(); }
  const totalSacola = () => sacola.reduce((t, i) => t + i.qtd * i.preco, 0);
  const qtdSacola = () => sacola.reduce((t, i) => t + i.qtd, 0);
  function desenharBarra() {
    const q = qtdSacola();
    $("#barra").classList.toggle("on", q > 0);
    $("#barraQtd").textContent = "Ver sacolinha · " + plural(q, "peça", "peças");
    $("#barraTotal").textContent = real(totalSacola());
  }
  function desenharSacola() {
    $("#itens").innerHTML = sacola.length ? sacola.map((i, n) => `<div class="item">
      <img src="${esc(i.foto)}" alt="">
      <div><div class="n">${esc(i.nome)}</div><div class="det">${esc([i.tam, i.cor].filter(Boolean).join(" · "))}${i.preco ? " · " + real(i.preco) : ""}</div></div>
      <div class="qtd"><button data-menos="${n}" aria-label="Menos">−</button><span>${i.qtd}</span><button data-mais="${n}" aria-label="Mais">+</button></div>
    </div>`).join("") : '<p class="vazio">Sua sacolinha está vazia.</p>';
    $("#total").textContent = real(totalSacola()) || "R$ 0";
    atualizarZap();
  }
  function voar(de) {
    if (calmo) return;
    const a = de.getBoundingClientRect(), b = $("#barra button").getBoundingClientRect();
    const h = document.createElement("div");
    h.className = "voa"; h.innerHTML = CORACAO;
    h.style.left = a.left + a.width / 2 - 11 + "px"; h.style.top = a.top + "px";
    document.body.appendChild(h);
    const dx = b.left + 30 - (a.left + a.width / 2), dy = b.top + b.height / 2 - a.top - 10;
    h.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${dx * .5}px,${dy * .2 - 60}px) scale(1.5)`, opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) scale(.6)`, opacity: .4 }], { duration: 650, easing: "cubic-bezier(.4,0,.2,1)" }).onfinish = () => h.remove();
  }
  function adicionar(card) {
    const p = pecas.find((x) => x.codigo === card.id), e = escolhas[p.codigo];
    const faltam = [lista(p.cores).length > 1 && !e.cor && "a cor", lista(p.tamanhos).length > 1 && !e.tam && "o tamanho"].filter(Boolean);
    const aviso = card.querySelector(".falta");
    if (faltam.length) { aviso.textContent = "escolha " + faltam.join(" e "); card.classList.remove("treme"); void card.offsetWidth; card.classList.add("treme"); return; }
    aviso.textContent = "";
    const ja = sacola.find((i) => i.codigo === p.codigo && i.tam === e.tam && i.cor === e.cor);
    if (ja) ja.qtd++; else sacola.push({ codigo: p.codigo, nome: p.nome, foto: p.foto, preco: num(p.preco), tam: e.tam, cor: e.cor, qtd: 1 });
    const b = card.querySelector("[data-add]");
    const primeira = qtdSacola() === 1;
    salvarSacola();
    if (!primeira) voar(b);
    b.innerHTML = "Na sacolinha ✓"; b.classList.add("feito");
    setTimeout(() => { b.innerHTML = CORACAO.replace('class="coracao"', "") + "Quero"; b.classList.remove("feito"); }, 1500);
    const bb = $("#barra button"); bb.classList.remove("pulo"); void bb.offsetWidth; setTimeout(() => bb.classList.add("pulo"), primeira ? 0 : 600);
  }
  // O botão é um LINK de verdade (não abre janela nova): funciona no Safari e dentro do Instagram/WhatsApp.
  function atualizarZap() {
    const nome = $("#nome").value.trim();
    const linhas = sacola.map((i) => `• ${i.qtd}x ${i.nome}${i.tam ? " – Tam. " + i.tam : ""}${i.cor ? " – " + i.cor : ""} – ${real(i.preco * i.qtd) || "a consultar"}`);
    const msg = "Olá! Quero fazer um pedido pelo catálogo 🛍️\n\n" + linhas.join("\n") + "\n\nTotal: " + real(totalSacola()) + (nome ? "\nNome: " + nome : "");
    $("#finalizar").href = "https://api.whatsapp.com/send?phone=" + WHATSAPP + "&text=" + encodeURIComponent(msg);
  }
  $("#nome").addEventListener("input", () => { atualizarZap(); guardar("namari-nome", $("#nome").value.trim()); });
  $("#finalizar").addEventListener("click", (ev) => {
    if (!sacola.length) { ev.preventDefault(); return; }
    if (!$("#nome").value.trim()) { ev.preventDefault(); const n = $("#nome"); n.focus(); n.placeholder = "Escreva seu nome aqui"; n.classList.remove("treme"); void n.offsetWidth; n.classList.add("treme"); return; }
    atualizarZap();
  });

  // ---------------- Toques ----------------
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button"); if (!t) return;
    const card = t.closest(".peca");
    if (t.dataset.secao) { secao = t.dataset.secao; preco = 0; categoria = "Todas"; desenhar(); return; }
    if (t.dataset.preco !== undefined) {
      preco = +t.dataset.preco; desenhar();
      const nova = document.querySelector(`[data-preco="${preco}"]`); if (nova && !calmo) nova.classList.add("balanca");
      return;
    }
    if (t.dataset.cat) { categoria = t.dataset.cat; desenhar(); return; }
    if (t.dataset.tam && card) { escolhas[card.id].tam = t.dataset.tam; card.querySelectorAll("[data-tam]").forEach((b) => b.setAttribute("aria-pressed", b === t)); card.querySelector(".falta").textContent = ""; return; }
    if (t.dataset.cor && card) { escolhas[card.id].cor = t.dataset.cor; card.querySelectorAll("[data-cor]").forEach((b) => b.setAttribute("aria-pressed", b === t)); card.querySelector(".corNome").textContent = t.dataset.cor; card.querySelector(".falta").textContent = ""; return; }
    if (t.hasAttribute("data-add")) { adicionar(card); return; }
    if (t.dataset.zoom) { const d = $("#zoom"); d.querySelector("img").src = t.dataset.zoom.replace("=w900", "=w1600"); d.showModal(); return; }
    if (t.id === "abrirSacola") { desenharSacola(); $("#sacola").showModal(); return; }
    if (t.hasAttribute("data-fechar")) { $("#sacola").close(); return; }
    if (t.dataset.mais) { sacola[+t.dataset.mais].qtd++; salvarSacola(); desenharSacola(); return; }
    if (t.dataset.menos) { const i = +t.dataset.menos; if (--sacola[i].qtd <= 0) sacola.splice(i, 1); salvarSacola(); desenharSacola(); if (!sacola.length) $("#sacola").close(); return; }
  });
  // tocar fora fecha a foto e a sacola
  ["zoom", "sacola"].forEach((id) => $("#" + id).addEventListener("click", (e) => { if (e.target.id === id) e.target.close(); }));
  $("#nome").value = ler("namari-nome", "");

  async function carregar() {
    desenharAbas();
    $("#grade").innerHTML = Array.from({ length: 4 }, () => '<div class="peca esqueleto"><div class="foto"></div></div>').join("");
    try {
      const d = await (await fetch(SHEILA, { cache: "no-store" })).json();
      pecas = d.pecas || [];
      sacola = sacola.filter((i) => pecas.some((p) => p.codigo === i.codigo)); // tira da sacola o que esgotou
      salvarSacola();
      const alvo = location.hash && pecas.find((p) => p.codigo === location.hash.slice(1));
      if (alvo) secao = secaoDe(alvo);
      desenhar();
      if (alvo) document.getElementById(alvo.codigo)?.scrollIntoView({ block: "center" });
    } catch (err) {
      $("#grade").innerHTML = '<p class="vazio">Não consegui carregar as peças agora.<br><a href="">Tentar de novo</a></p>';
    }
  }
  carregar();
</script>
</body>
</html>
