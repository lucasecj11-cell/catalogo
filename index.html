<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>naMari moda feminina · Catálogo</title>

<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="naMari moda feminina · Catálogo">
<meta property="og:description" content="Escolha as peças e faça o pedido pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  /* 🪟 Vitrinista da naMari. Cara da loja: parede rosa, logo de máquina de escrever, coração vermelho,
     frases em itálico, preço fixo e destaques redondos como no Instagram. Lê as peças da Sheila na hora. */
  :root {
    --fundo: #ffffff; --texto: #1a1a1a; --suave: #6f6468; --linha: #f0dfe3; --leve: #fbf1f3;
    --rosa: #f6d7de; --rosa-forte: #e9aebc; --botao: #1a1a1a; --botao-texto: #ffffff; --vermelho: #d81f2a;
    --cartao: #ffffff; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #141113; --texto: #f5eef0; --suave: #b7a9ae; --linha: #33282c; --leve: #1f191c;
      --rosa: #3a2a30; --rosa-forte: #6b4150; --botao: #f5eef0; --botao-texto: #141113; --vermelho: #ff5a63;
      --cartao: #1b1619; color-scheme: dark; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.45 "Nunito Sans", system-ui, -apple-system, sans-serif; padding-bottom: 88px; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  .italico { font-family: "Playfair Display", Georgia, serif; font-style: italic; }

  /* topo: a parede rosa da loja com o selo redondo do logo */
  header { background: var(--rosa); text-align: center; padding: 26px 16px 22px; }
  .selo { width: 132px; height: 132px; margin: 0 auto; border-radius: 50%; background: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; box-shadow: 0 0 0 4px #fff, 0 0 0 5px var(--rosa-forte); color: #111; }
  .logo { margin: 0; font: 700 31px/1 "Courier Prime", "Courier New", monospace; letter-spacing: -.02em; }
  .logo .i { position: relative; display: inline-block; }
  .logo .i::before { content: "ı"; }
  .logo .coracao { position: absolute; left: 50%; top: -.05em; width: .42em; transform: translateX(-50%); fill: #d81f2a; }
  .moda { font-size: 11.5px; margin-top: 3px; }
  .frase { font-size: 19px; margin: 14px 0 2px; }
  .lugar { color: var(--suave); font-size: 13.5px; }

  .abas { position: sticky; top: 0; z-index: 10; background: var(--fundo); border-bottom: 1px solid var(--linha); }
  .rolagem { display: flex; overflow-x: auto; scrollbar-width: none; max-width: 1100px; margin: 0 auto; padding: 0 6px; }
  .rolagem::-webkit-scrollbar { display: none; }
  .aba { flex: none; background: none; border: 0; padding: 14px 12px 11px; font-size: 15px; font-weight: 600; color: var(--suave); border-bottom: 3px solid transparent; cursor: pointer; }
  .aba[aria-pressed="true"] { color: var(--texto); border-bottom-color: var(--vermelho); }

  main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .filtro { padding: 18px 0 2px; }
  .rotulo { font-size: 17px; margin: 0 0 10px; }
  .opcoes { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 8px; }
  .opcoes::-webkit-scrollbar { display: none; }

  /* preço fixo: etiquetas de roupa */
  .tag { flex: none; position: relative; border: 1.5px solid var(--texto); background: var(--cartao); border-radius: 6px 14px 14px 6px;
    padding: 9px 14px 9px 26px; font: 700 17px/1 "Courier Prime", monospace; cursor: pointer; transition: transform .15s; }
  .tag::before { content: ""; position: absolute; left: 9px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; border: 1.5px solid var(--texto); }
  .tag.valor { color: var(--vermelho); }
  .tag[aria-pressed="true"] { background: var(--vermelho); border-color: var(--vermelho); color: #fff; transform: rotate(-3deg); }
  .tag[aria-pressed="true"]::before { border-color: #fff; background: var(--vermelho); }

  /* categorias: destaques redondos, como no Instagram */
  .destaque { flex: none; width: 74px; background: none; border: 0; padding: 0; text-align: center; cursor: pointer; }
  .bola { width: 68px; height: 68px; margin: 0 auto 5px; border-radius: 50%; padding: 3px; background: var(--linha); }
  .destaque[aria-pressed="true"] .bola { background: linear-gradient(135deg, var(--vermelho), var(--rosa-forte)); }
  .bola span { display: flex; width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--fundo); background: #fff center/cover no-repeat;
    align-items: center; justify-content: center; font: 700 12px "Courier Prime", monospace; color: #111; }
  .destaque small { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .destaque[aria-pressed="true"] small { font-weight: 700; }

  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; padding: 14px 0 32px; }
  @media (min-width: 700px) { .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 20px; } }
  @media (min-width: 1000px) { .grade { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .peca { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .foto { position: relative; aspect-ratio: 4/5; background: var(--leve); border: 0; padding: 0; cursor: zoom-in; display: block; width: 100%; overflow: hidden; border-radius: 10px; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .3s; }
  .foto img.ok { opacity: 1; }
  .etiqueta { position: absolute; left: 8px; top: 8px; background: #fff; color: #d81f2a; border-radius: 4px 10px 10px 4px; padding: 4px 9px 4px 16px;
    font: 700 15px/1 "Courier Prime", monospace; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .etiqueta::before { content: ""; position: absolute; left: 6px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--rosa-forte); }
  .nome { font-weight: 600; font-size: 15px; margin: 2px 0 0; line-height: 1.25; }
  .escolha { display: flex; flex-wrap: wrap; gap: 6px; }
  .tam { min-width: 36px; height: 32px; background: var(--cartao); border: 1px solid var(--rosa-forte); border-radius: 16px; padding: 0 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .tam[aria-pressed="true"] { background: var(--botao); color: var(--botao-texto); border-color: var(--botao); }
  .cor { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); padding: 0; cursor: pointer; position: relative; }
  .cor[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border: 2px solid var(--vermelho); border-radius: 50%; }
  .cor.txt { width: auto; height: 26px; border-radius: 13px; padding: 0 10px; font-size: 12.5px; background: var(--cartao); border-color: var(--rosa-forte); }
  .cor.txt[aria-pressed="true"] { background: var(--botao); color: var(--botao-texto); border-color: var(--botao); }
  .cor.txt[aria-pressed="true"]::after { display: none; }
  .corNome { font-size: 12.5px; color: var(--suave); min-height: 1em; }
  .add { margin-top: auto; background: var(--botao); color: var(--botao-texto); border: 0; border-radius: 22px; padding: 11px 6px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .add:active { opacity: .85; }
  .add.feito { background: var(--vermelho); color: #fff; }
  .falta { color: var(--vermelho); font-size: 12.5px; }
  .treme { animation: treme .3s; }
  @keyframes treme { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .vazio { grid-column: 1 / -1; text-align: center; color: var(--suave); padding: 48px 12px; font-size: 18px; }
  .esqueleto .foto { animation: pisca 1.2s infinite alternate; }
  @keyframes pisca { to { opacity: .5; } }

  footer { background: var(--rosa); text-align: center; padding: 30px 16px 28px; font-size: 14.5px; line-height: 1.8; }
  footer .frase { margin: 0 0 8px; }
  footer a { text-decoration: none; font-weight: 600; }

  /* barra da sacola */
  .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(120%); transition: transform .25s; pointer-events: none; }
  .barra.on { transform: none; }
  .barra button { pointer-events: auto; width: 100%; max-width: 520px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; background: var(--botao); color: var(--botao-texto); border: 0; border-radius: 28px; padding: 15px 20px; font-size: 15.5px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .pulo { animation: pulo .35s; }
  @keyframes pulo { 50% { transform: scale(1.05); } }

  dialog { border: 0; padding: 0; color: var(--texto); background: var(--fundo); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  #zoom { background: transparent; max-width: 100vw; max-height: 100vh; }
  #zoom::backdrop { background: rgba(0,0,0,.9); }
  #zoom img { max-width: 100vw; max-height: 92vh; display: block; }
  #sacola { width: 100%; max-width: 520px; margin: auto auto 0; border-radius: 18px 18px 0 0; max-height: 88vh; display: flex; flex-direction: column; }
  #sacola:not([open]) { display: none; }
  @media (min-width: 700px) { #sacola { margin: auto; border-radius: 14px; } }
  .topo { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 12px; background: var(--rosa); }
  .topo h2 { margin: 0; font-size: 22px; font-weight: 500; }
  .fechar { background: none; border: 0; font-size: 28px; line-height: 1; padding: 0 4px; cursor: pointer; }
  .itens { overflow-y: auto; padding: 4px 16px; flex: 1; }
  .item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linha); }
  .item img { width: 56px; height: 70px; object-fit: cover; background: var(--leve); display: block; border-radius: 6px; }
  .item .det { font-size: 13px; color: var(--suave); }
  .qtd { display: flex; align-items: center; border: 1px solid var(--rosa-forte); border-radius: 18px; }
  .qtd button { background: none; border: 0; width: 32px; height: 32px; font-size: 17px; cursor: pointer; }
  .qtd span { min-width: 18px; text-align: center; font-size: 14px; font-weight: 700; }
  .fim { padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linha); display: grid; gap: 10px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; font-size: 17px; }
  .total b { color: var(--vermelho); font: 700 22px "Courier Prime", monospace; }
  .fim input { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--rosa-forte); border-radius: 22px; background: var(--fundo); color: var(--texto); }
  .zap { display: block; text-align: center; text-decoration: none; background: #1fa855; color: #fff; border: 0; border-radius: 24px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .obs { font-size: 12.5px; color: var(--suave); text-align: center; margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="selo">
    <h1 class="logo" aria-label="naMari">naMar<span class="i"><svg class="coracao" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21.6 10.3 20C4.2 14.5.2 10.9.2 6.5.2 2.9 3 .2 6.6.2c2 0 3.9.9 5.4 2.4C13.5 1.1 15.4.2 17.4.2 21 .2 23.8 2.9 23.8 6.5c0 4.4-4 8-10.1 13.5z"/></svg></span></h1>
    <div class="moda">moda feminina</div>
  </div>
  <p class="frase italico">Preço fixo: toda a loja em 4 valores</p>
  <div class="lugar">De SCP para o Brasil 🌍</div>
</header>

<nav class="abas"><div class="rolagem" id="abas" aria-label="Seções"></div></nav>

<main>
  <div id="filtros"></div>
  <div class="grade" id="grade" aria-live="polite"></div>
</main>

<footer>
  <p class="frase italico">Vem conhecer a loja ❤️</p>
  <a href="https://maps.google.com/?q=Av.+XV+de+Novembro,+689,+Santa+Cruz+das+Palmeiras+SP" target="_blank" rel="noopener">Av. XV de Novembro, 689 · Santa Cruz das Palmeiras</a><br>
  <a href="https://www.instagram.com/namari_feminino" target="_blank" rel="noopener">@namari_feminino</a> ·
  <a href="https://api.whatsapp.com/send?phone=5519971060389">(19) 97106-0389</a>
</footer>

<div class="barra" id="barra"><button id="abrirSacola"><span id="barraQtd">Sacola</span><span id="barraTotal"></span></button></div>

<dialog id="zoom"><img alt=""></dialog>
<dialog id="sacola" aria-labelledby="tituloSacola">
  <div class="topo"><h2 id="tituloSacola" class="italico">Sua sacolinha</h2><button class="fechar" data-fechar aria-label="Fechar">×</button></div>
  <div class="itens" id="itens"></div>
  <div class="fim">
    <div class="total"><span>Total</span><b id="total"></b></div>
    <input id="nome" placeholder="Seu nome" autocomplete="given-name" aria-label="Seu nome">
    <a class="zap" id="finalizar" href="https://api.whatsapp.com/send?phone=5519971060389">Finalizar pelo WhatsApp</a>
    <p class="obs">Sem pagamento aqui: a gente combina tudo pelo WhatsApp.</p>
  </div>
</dialog>

<script>
  // ---------------- Configuração ----------------
  const SHEILA = "https://script.google.com/macros/s/AKfycby_ZSkLAnolCtiirdZykfTug9vQhdynzTBVgZnf3Bnj_dvxfwrv5xqwjGGN735HUuv6/exec?catalogo=1";
  const WHATSAPP = "5519971060389";
  const PRECOS_FIXOS = [30, 40, 60, 90];
  // Abas e as categorias do Carlão que entram em cada uma. As de Roupas aparecem mesmo vazias.
  const SECOES = [
    { nome: "Roupas", fixas: ["Blusas", "Vestidos", "Calças", "Saias", "Shorts", "Conjuntos"], precos: true,
      junta: ["Camisetas", "Camisas", "Macacões", "Casacos", "Moda praia", "Lingerie"] },
    { nome: "Acessórios", fixas: [], junta: ["Acessórios", "Bolsas", "Mochilas"] },
    { nome: "Higiene e cuidados", fixas: [], junta: ["Higiene e cuidados"] },
    { nome: "Sapatos", fixas: [], junta: ["Calçados", "Sapatos"] },
  ];
  const CORES = { preto: "#111", preta: "#111", branco: "#fff", branca: "#fff", "off-white": "#f3efe6", offwhite: "#f3efe6",
    bege: "#d9c5a6", nude: "#e3bfa3", cinza: "#9a9a9a", "azul marinho": "#1f2a4d", marinho: "#1f2a4d", "azul jeans": "#4d6f99",
    jeans: "#4d6f99", "azul bebê": "#bcd7ee", "azul bebe": "#bcd7ee", "azul claro": "#a9c8e6", azul: "#2f5fa8", lavanda: "#b9a7d6",
    lilás: "#b79cd1", lilas: "#b79cd1", roxo: "#6a3d8f", rosa: "#ee9fb8", "rosa claro": "#f6c6d4", pink: "#e3457f", vermelho: "#c8102e",
    vermelha: "#c8102e", vinho: "#6d1a2b", laranja: "#ee7d32", amarelo: "#f0cf43", amarela: "#f0cf43", verde: "#4d8a5b",
    "verde militar": "#5b6340", "verde água": "#8fd0c3", marrom: "#6e4a32", caramelo: "#b07a45", terracota: "#b8633f", dourado: "#c9a548", prata: "#c0c0c0" };

  // ---------------- Estado ----------------
  const $ = (s) => document.querySelector(s);
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const ler = (k, padrao) => { try { return JSON.parse(localStorage.getItem(k)) ?? padrao; } catch (e) { return padrao; } };
  let pecas = [], secao = "Roupas", preco = 0, categoria = "Todas";
  let sacola = ler("namari-sacola", []);
  const escolhas = {}; // codigo -> { tam, cor }

  const num = (v) => typeof v === "number" ? v : parseFloat(String(v || "").replace(/[^\d,.]/g, "").replace(/\.(?=\d{3})/g, "").replace(",", ".")) || 0;
  const real = (n) => n ? n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: n % 1 ? 2 : 0 }) : "";
  const lista = (t) => String(t || "").split(/,|\/|;| e /).map((x) => x.trim()).filter(Boolean);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const semAcento = (t) => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const corHex = (c) => CORES[c.toLowerCase()] || CORES[semAcento(c)];
  const secaoDe = (p) => (SECOES.find((s) => s.fixas.includes(p.categoria) || s.junta.includes(p.categoria)) || SECOES[0]).nome;

  // ---------------- Desenho ----------------
  function desenharAbas() {
    $("#abas").innerHTML = SECOES.map((s) => `<button class="aba" aria-pressed="${s.nome === secao}" data-secao="${esc(s.nome)}">${esc(s.nome)}</button>`).join("");
  }

  function desenharFiltros() {
    const s = SECOES.find((x) => x.nome === secao);
    const daqui = pecas.filter((p) => secaoDe(p) === secao);
    let html = "";
    if (s.precos) {
      const valores = [...new Set([...PRECOS_FIXOS, ...daqui.map((p) => num(p.preco)).filter(Boolean)])].sort((a, b) => a - b);
      html += `<div class="filtro"><p class="rotulo italico">Escolha o valor</p><div class="opcoes">
        <button class="tag" aria-pressed="${!preco}" data-preco="0">Todos</button>
        ${valores.map((v) => `<button class="tag valor" aria-pressed="${preco === v}" data-preco="${v}">${real(v)}</button>`).join("")}</div></div>`;
    }
    const base = s.precos && preco ? daqui.filter((p) => num(p.preco) === preco) : daqui;
    const cats = [...new Set([...s.fixas, ...base.map((p) => p.categoria)])];
    if (cats.length > 1) {
      if (!cats.includes(categoria)) categoria = "Todas";
      const capa = (c) => (base.find((p) => c === "Todas" || p.categoria === c) || {}).foto;
      html += `<div class="filtro"><p class="rotulo italico">Categorias</p><div class="opcoes">
        ${["Todas", ...cats].map((c) => { const f = capa(c);
          return `<button class="destaque" aria-pressed="${c === categoria}" data-cat="${esc(c)}"><div class="bola"><span${f ? ` style="background-image:url('${esc(f).replace("=w900", "=w200")}')"` : ""}>${f ? "" : "naMari"}</span></div><small>${esc(c)}</small></button>`;
        }).join("")}</div></div>`;
    } else categoria = "Todas";
    $("#filtros").innerHTML = html;
  }

  function cartao(p) {
    const tams = lista(p.tamanhos), cores = lista(p.cores);
    const e = escolhas[p.codigo] || (escolhas[p.codigo] = { tam: tams.length === 1 ? tams[0] : "", cor: cores.length === 1 ? cores[0] : "" });
    return `<article class="peca" id="${esc(p.codigo)}">
      <button class="foto" data-zoom="${esc(p.foto)}" aria-label="Ver foto maior"><img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy" onload="this.classList.add('ok')"><span class="etiqueta">${real(num(p.preco)) || "Consulte"}</span></button>
      <h2 class="nome">${esc(p.nome)}</h2>
      ${cores.length ? `<div class="escolha" role="group" aria-label="Cor">${cores.map((c) => {
        const h = corHex(c);
        return h ? `<button class="cor" style="background:${h}" title="${esc(c)}" aria-label="${esc(c)}" aria-pressed="${e.cor === c}" data-cor="${esc(c)}"></button>`
                 : `<button class="cor txt" aria-pressed="${e.cor === c}" data-cor="${esc(c)}">${esc(c)}</button>`;
      }).join("")}</div><div class="corNome">${esc(e.cor || (cores.length > 1 ? "Escolha a cor" : ""))}</div>` : ""}
      ${tams.length ? `<div class="escolha" role="group" aria-label="Tamanho">${tams.map((t) => `<button class="tam" aria-pressed="${e.tam === t}" data-tam="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
      <div class="falta" aria-live="polite"></div>
      <button class="add" data-add>Adicionar à sacola</button>
    </article>`;
  }

  function desenhar() {
    desenharAbas(); desenharFiltros();
    const s = SECOES.find((x) => x.nome === secao);
    const vis = pecas.filter((p) => secaoDe(p) === secao && (!s.precos || !preco || num(p.preco) === preco) && (categoria === "Todas" || p.categoria === categoria));
    $("#grade").innerHTML = vis.length ? vis.map(cartao).join("") : '<p class="vazio">Nenhuma peça cadastrada aqui ainda — em breve novidades!</p>';
  }

  // ---------------- Sacola ----------------
  function salvarSacola() { guardar("namari-sacola", sacola); desenharBarra(); }
  const totalSacola = () => sacola.reduce((t, i) => t + i.qtd * i.preco, 0);
  function desenharBarra() {
    const q = sacola.reduce((t, i) => t + i.qtd, 0);
    $("#barra").classList.toggle("on", q > 0);
    $("#barraQtd").textContent = "Ver sacola (" + q + (q === 1 ? " peça)" : " peças)");
    $("#barraTotal").textContent = real(totalSacola());
  }
  function desenharSacola() {
    $("#itens").innerHTML = sacola.length ? sacola.map((i, n) => `<div class="item">
      <img src="${esc(i.foto)}" alt="">
      <div><div>${esc(i.nome)}</div><div class="det">${esc([i.tam, i.cor].filter(Boolean).join(" · "))}${i.preco ? " · " + real(i.preco) : ""}</div></div>
      <div class="qtd"><button data-menos="${n}" aria-label="Menos">−</button><span>${i.qtd}</span><button data-mais="${n}" aria-label="Mais">+</button></div>
    </div>`).join("") : '<p class="vazio">Sua sacola está vazia.</p>';
    $("#total").textContent = real(totalSacola()) || "R$ 0";
    atualizarZap();
  }
  function adicionar(card) {
    const p = pecas.find((x) => x.codigo === card.id), e = escolhas[p.codigo];
    const faltam = [lista(p.cores).length > 1 && !e.cor && "a cor", lista(p.tamanhos).length > 1 && !e.tam && "o tamanho"].filter(Boolean);
    const aviso = card.querySelector(".falta");
    if (faltam.length) { aviso.textContent = "Escolha " + faltam.join(" e "); card.classList.remove("treme"); void card.offsetWidth; card.classList.add("treme"); return; }
    aviso.textContent = "";
    const ja = sacola.find((i) => i.codigo === p.codigo && i.tam === e.tam && i.cor === e.cor);
    if (ja) ja.qtd++; else sacola.push({ codigo: p.codigo, nome: p.nome, foto: p.foto, preco: num(p.preco), tam: e.tam, cor: e.cor, qtd: 1 });
    salvarSacola();
    const b = card.querySelector("[data-add]"); b.textContent = "Na sacolinha ❤"; b.classList.add("feito");
    setTimeout(() => { b.textContent = "Adicionar à sacola"; b.classList.remove("feito"); }, 1400);
    $("#barra button").classList.remove("pulo"); void $("#barra").offsetWidth; $("#barra button").classList.add("pulo");
  }
  // O botão é um LINK de verdade (não abre janela nova): funciona no Safari e dentro do Instagram/WhatsApp.
  function atualizarZap() {
    const nome = $("#nome").value.trim();
    const linhas = sacola.map((i) => `• ${i.qtd}x ${i.nome}${i.tam ? " – Tam. " + i.tam : ""}${i.cor ? " – " + i.cor : ""} – ${real(i.preco * i.qtd) || "a consultar"}`);
    const msg = "Olá! Quero fazer um pedido pelo catálogo 🛍️\n\n" + linhas.join("\n") + "\n\nTotal: " + real(totalSacola()) + (nome ? "\nNome: " + nome : "");
    $("#finalizar").href = "https://api.whatsapp.com/send?phone=" + WHATSAPP + "&text=" + encodeURIComponent(msg);
  }
  $("#nome").addEventListener("input", () => { atualizarZap(); guardar("namari-nome", $("#nome").value.trim()); });
  $("#finalizar").addEventListener("click", (ev) => {
    if (!sacola.length) { ev.preventDefault(); return; }
    if (!$("#nome").value.trim()) { ev.preventDefault(); $("#nome").focus(); $("#nome").classList.add("treme"); setTimeout(() => $("#nome").classList.remove("treme"), 400); return; }
    atualizarZap();
  });

  // ---------------- Toques ----------------
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button"); if (!t) return;
    const card = t.closest(".peca");
    if (t.dataset.secao) { secao = t.dataset.secao; preco = 0; categoria = "Todas"; desenhar(); return; }
    if (t.dataset.preco !== undefined) { preco = +t.dataset.preco; desenhar(); return; }
    if (t.dataset.cat) { categoria = t.dataset.cat; desenhar(); return; }
    if (t.dataset.tam && card) { escolhas[card.id].tam = t.dataset.tam; card.querySelectorAll("[data-tam]").forEach((b) => b.setAttribute("aria-pressed", b === t)); card.querySelector(".falta").textContent = ""; return; }
    if (t.dataset.cor && card) { escolhas[card.id].cor = t.dataset.cor; card.querySelectorAll("[data-cor]").forEach((b) => b.setAttribute("aria-pressed", b === t)); card.querySelector(".corNome").textContent = t.dataset.cor; card.querySelector(".falta").textContent = ""; return; }
    if (t.hasAttribute("data-add")) { adicionar(card); return; }
    if (t.dataset.zoom) { const d = $("#zoom"); d.querySelector("img").src = t.dataset.zoom.replace("=w900", "=w1600"); d.showModal(); return; }
    if (t.id === "abrirSacola") { desenharSacola(); $("#sacola").showModal(); return; }
    if (t.hasAttribute("data-fechar")) { $("#sacola").close(); return; }
    if (t.dataset.mais) { sacola[+t.dataset.mais].qtd++; salvarSacola(); desenharSacola(); return; }
    if (t.dataset.menos) { const i = +t.dataset.menos; if (--sacola[i].qtd <= 0) sacola.splice(i, 1); salvarSacola(); desenharSacola(); if (!sacola.length) $("#sacola").close(); return; }
  });
  // tocar fora fecha a foto e a sacola
  ["zoom", "sacola"].forEach((id) => $("#" + id).addEventListener("click", (e) => { if (e.target.id === id) e.target.close(); }));
  $("#nome").value = ler("namari-nome", "");

  async function carregar() {
    desenharAbas();
    $("#grade").innerHTML = Array.from({ length: 4 }, () => '<div class="peca esqueleto"><div class="foto"></div></div>').join("");
    try {
      const d = await (await fetch(SHEILA, { cache: "no-store" })).json();
      pecas = d.pecas || [];
      // tira da sacola o que esgotou
      sacola = sacola.filter((i) => pecas.some((p) => p.codigo === i.codigo));
      salvarSacola();
      const alvo = location.hash && pecas.find((p) => p.codigo === location.hash.slice(1));
      if (alvo) secao = secaoDe(alvo);
      desenhar();
      if (alvo) document.getElementById(alvo.codigo)?.scrollIntoView({ block: "center" });
    } catch (err) {
      $("#grade").innerHTML = '<p class="vazio">Não consegui carregar as peças agora. <a href="">Tentar de novo</a></p>';
    }
  }
  carregar();
</script>
</body>
</html>
